
workflows:
  salim-ios:
    name: SALIM iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Unzip project
        script: |
          unzip -o SALIM_iOS_project.zip -d .
      - name: Find Xcode project
        script: |
          find . -name "*.xcodeproj"
